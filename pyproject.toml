[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helmet-safety"
version = "2.0.0"
description = "YOLO-based construction-site hard-hat detection and alerting with reproducible evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jiahao Liu" }]
keywords = ["yolo", "object-detection", "construction-safety", "ppe", "computer-vision"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "ultralytics>=8.3",
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "pandas>=2.0", "seaborn>=0.13", "tqdm>=4.66"]

[project.scripts]
helmet-safety = "helmet_safety.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["helmet_safety*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
# Focus on real defects (unused names, bad imports, suspicious patterns).
# PEP-585/604 modernisation (UP*) is intentionally excluded: the codebase
# keeps typing aliases for readability and supports 3.11+ uniformly.
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E702", "B905"]

[tool.ruff.lint.per-file-ignores]
# Pipeline scripts inject src/ into sys.path before importing the package.
"scripts/*.py" = ["E402"]
