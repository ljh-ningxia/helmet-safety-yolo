<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <rect width="1280" height="560" fill="#ffffff"/>
  <text x="40" y="48" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="30" font-weight="700" fill="#1c2b26">系统基线 · 先画流程，再圈出本人改动</text>
  <rect x="40" y="66" width="1200" height="42" rx="8" fill="#e7f6ef"/>
  <text x="58" y="93" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#087a54">页面唯一结论：先理解原系统，才能知道改动到底解决了什么。</text>

  <g font-family="Microsoft YaHei,sans-serif">
    <!-- baseline row -->
    <g>
      <rect x="40" y="150" width="170" height="92" rx="10" fill="#f2f5f3" stroke="#dceae3" stroke-width="2"/>
      <text x="125" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2b26">成像</text>
      <text x="125" y="216" text-anchor="middle" font-size="13" fill="#6b7d76">摄像头 / RTSP</text>

      <rect x="235" y="150" width="170" height="92" rx="10" fill="#f2f5f3" stroke="#dceae3" stroke-width="2"/>
      <text x="320" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2b26">预处理</text>
      <text x="320" y="216" text-anchor="middle" font-size="13" fill="#6b7d76">限幅 / 归一化</text>

      <rect x="430" y="150" width="170" height="92" rx="10" fill="#0f9b6c" stroke="#087a54" stroke-width="2"/>
      <text x="515" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">定位 / 检测</text>
      <text x="515" y="216" text-anchor="middle" font-size="13" fill="#d9f5e8">改动 ①</text>

      <rect x="625" y="150" width="170" height="92" rx="10" fill="#0f9b6c" stroke="#087a54" stroke-width="2"/>
      <text x="710" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">判定</text>
      <text x="710" y="216" text-anchor="middle" font-size="13" fill="#d9f5e8">改动 ②</text>

      <rect x="820" y="150" width="170" height="92" rx="10" fill="#f2f5f3" stroke="#dceae3" stroke-width="2"/>
      <text x="905" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#1c2b26">通讯 / 报表</text>
      <text x="905" y="216" text-anchor="middle" font-size="13" fill="#6b7d76">事件台账</text>

      <rect x="1015" y="150" width="225" height="92" rx="10" fill="#0f9b6c" stroke="#087a54" stroke-width="2"/>
      <text x="1127" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">业务动作</text>
      <text x="1127" y="216" text-anchor="middle" font-size="13" fill="#d9f5e8">改动 ③</text>
    </g>
    <g fill="#0f9b6c" font-size="24" font-weight="700">
      <text x="214" y="204">→</text><text x="409" y="204">→</text><text x="604" y="204">→</text>
      <text x="799" y="204">→</text><text x="994" y="204">→</text>
    </g>
  </g>

  <!-- three innovation cards -->
  <g font-family="Microsoft YaHei,sans-serif">
    <rect x="40" y="278" width="386" height="170" rx="10" fill="#f3fbf7" stroke="#bfe5d4" stroke-width="2"/>
    <rect x="40" y="278" width="386" height="38" rx="10" fill="#0f9b6c"/>
    <text x="58" y="304" font-size="16" font-weight="700" fill="#ffffff">① 定位/检测 · 重叠切片推理</text>
    <text x="58" y="342" font-size="14" fill="#1c2b26">问题：远景安全帽仅 20×20 像素，缩放后漏检</text>
    <text x="58" y="368" font-size="14" fill="#1c2b26">改动：整图一次 → 切片 + 放大 + 跨切片 NMS</text>
    <text x="58" y="394" font-size="14" fill="#1c2b26">代价：推理次数增加，FPS 下降，误检增多</text>
    <text x="58" y="426" font-size="13" fill="#087a54">证据：src/tiling.py · E1_tiling.json</text>

    <rect x="447" y="278" width="386" height="170" rx="10" fill="#f3fbf7" stroke="#bfe5d4" stroke-width="2"/>
    <rect x="447" y="278" width="386" height="38" rx="10" fill="#0f9b6c"/>
    <text x="465" y="304" font-size="16" font-weight="700" fill="#ffffff">② 判定 · 跨帧时序投票</text>
    <text x="465" y="342" font-size="14" fill="#1c2b26">问题：单帧误检造成告警忽明忽暗</text>
    <text x="465" y="368" font-size="14" fill="#1c2b26">改动：单帧即报 → 连续 K 帧命中确认</text>
    <text x="465" y="394" font-size="14" fill="#1c2b26">代价：K-1 帧固有延迟，快目标可能漏报</text>
    <text x="465" y="426" font-size="13" fill="#087a54">证据：src/temporal.py · E2_temporal.json</text>

    <rect x="854" y="278" width="386" height="170" rx="10" fill="#f3fbf7" stroke="#bfe5d4" stroke-width="2"/>
    <rect x="854" y="278" width="386" height="38" rx="10" fill="#0f9b6c"/>
    <text x="872" y="304" font-size="16" font-weight="700" fill="#ffffff">③ 业务动作 · 分级预警闭环</text>
    <text x="872" y="342" font-size="14" fill="#1c2b26">问题：检测完没有处置，事件不可回溯</text>
    <text x="872" y="368" font-size="14" fill="#1c2b26">改动：L1/L2/L3 + 冷却去重 + 证据快照</text>
    <text x="872" y="394" font-size="14" fill="#1c2b26">代价：磁盘 / 网络开销，窗口内不再上报</text>
    <text x="872" y="426" font-size="13" fill="#087a54">证据：src/alert.py · E3_dedup.json</text>
  </g>

  <rect x="40" y="474" width="1200" height="60" rx="8" fill="#fff8e8" stroke="#e6cf9a" stroke-width="2"/>
  <text x="58" y="499" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#6b511c">公平 A/B：A / B 由同一 PipelineConfig 派生，每次只开一个开关；数据、阈值、硬件、库版本全部冻结。</text>
  <text x="58" y="522" font-family="Microsoft YaHei,sans-serif" font-size="14" fill="#8a6a28">让每一次改进，都留下可复核的证据 · 结论 → 证据 → 边界</text>
</svg>
