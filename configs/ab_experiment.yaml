# 公平 A/B 实验冻结条件清单
# 原则：A 与 B 由同一 PipelineConfig 派生；每次只允许一个 enable_* 为 true。
frozen:
  dataset: "同一帧序列 / 固定划分 / 固定 seed"
  config: "同一 conf、iou、imgsz、推理流程、参数阈值"
  device: "同一硬件与运行环境（GPU 型号、驱动、库版本）"
  metrics: "准确性（有真值时）+ 时延/FPS + 失败异常率 + 事件条数"
  version: "A、B 基于同一代码基线，仅引入一项主要改动"

experiments:
  - id: E1_tiling
    change: "enable_tiling: false → true"
    layer: 检测层
    observe: [total_detections, recall, precision, map50, fps, mean_latency_ms]
  - id: E2_temporal
    change: "enable_temporal: false → true"
    layer: 判定层
    observe: [confirmed_total, alert_events, mean_latency_ms]
  - id: E3_dedup
    change: "enable_alert_dedup: false → true"
    layer: 业务层
    observe: [alert_events, by_level]

forbidden_claims:
  - "检出框数量增加 ≠ 准确率提升"
  - "告警条数减少 ≠ 现场违规减少"
  - "合成数据结果 ≠ 真实工地性能"
  - "单次运行结果 ≠ 跨数据集 / 跨硬件可外推结论"
